spring.application.name=vrms
spring.config.import=optional:file:.env[.properties]

# MySQL Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/defaultdb}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Server & Static files mapping
server.port=8080
spring.web.resources.static-locations=classpath:/META-INF/resources/,classpath:/resources/,classpath:/static/,classpath:/public/,file:images/

# System Root Account Settings (Can be overridden via environment variables APP_ROOT_USERNAME and APP_ROOT_PASSWORD)
app.root.username=${APP_ROOT_USERNAME:admin_root}
app.root.password=${APP_ROOT_PASSWORD:Root@123}
